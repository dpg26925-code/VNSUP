<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="icon-grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="icon-grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#EA580C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#icon-grad-slate)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Precision Nexus Hexagon Node -->
  <g filter="url(#icon-glow)" transform="translate(10, 10)">
    <!-- Tech supply lines -->
    <path d="M6 10L22 34L38 10" stroke="url(#icon-grad-orange)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 34V18" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left V Shape -->
    <path d="M6 10L16 26L20 20L12 8L6 10Z" fill="url(#icon-grad-orange)"/>
    <!-- Right N Shape -->
    <path d="M26 12L38 30V10H34V22L26 10V12Z" fill="#FFFFFF"/>

    <!-- Dynamic AI Core Nodes -->
    <circle cx="6" cy="10" r="3" fill="#FF9E58"/>
    <circle cx="38" cy="10" r="3" fill="#38BDF8"/>
    <circle cx="22" cy="34" r="4.5" fill="url(#icon-grad-orange)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="22" cy="18" r="2.5" fill="#38BDF8"/>
  </g>
</svg>
